<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Real-Time Weather Information</p>
        </header>

        <section class="search-section">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>
        </section>

        <p id="errorMessage"></p>

        <section id="weatherCard" class="weather-card">

            <h2 id="cityName">Search for a city</h2>

            <div class="weather-main">
                <div>
                    <p class="label">Temperature</p>
                    <h3 id="temperature">--°C</h3>
                </div>

                <div>
                    <p class="label">Weather</p>
                    <h3 id="weatherDescription">--</h3>
                </div>
            </div>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </section>

        <footer>
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
